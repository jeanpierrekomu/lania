# Copia de seguridad diaria de la base (Supabase) + limpieza de retención + chequeo de que el servidor responde.
# - La copia se guarda CIFRADA como artifact de este repositorio privado durante 30 días.
# - Tocar la base cada día evita que Supabase pause el proyecto gratuito por inactividad (7 días).
# - Si algo falla, GitHub te avisa por correo (job en rojo).
# Configuración (Settings → Secrets and variables → Actions):
#   secrets:   SUPABASE_DB_URL (cadena del «Session pooler»), BACKUP_PASSPHRASE (frase larga; guárdala aparte)
#   variables: API_HEALTH_URL (p. ej. https://lania-api.onrender.com/api/v1/health/ready), opcional
name: Copia diaria

on:
  schedule:
    - cron: "17 8 * * *" # todos los días, 03:17 en Perú
  workflow_dispatch: # botón «Run workflow» para hacer una copia ahora

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
      BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
    steps:
      - uses: actions/checkout@v4
      - name: ¿Está configurado?
        id: cfg
        run: |
          if [ -z "$DATABASE_URL" ] || [ -z "$BACKUP_PASSPHRASE" ]; then
            echo "::notice::Faltan los secrets SUPABASE_DB_URL o BACKUP_PASSPHRASE: no se hace copia todavía."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Cliente de PostgreSQL 17 (igual o más nuevo que el servidor de Supabase)
        if: steps.cfg.outputs.ready == 'true'
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSo /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"
      - name: Copia cifrada
        if: steps.cfg.outputs.ready == 'true'
        run: scripts/backup_db.sh backups
      - uses: actions/upload-artifact@v4
        if: steps.cfg.outputs.ready == 'true'
        with:
          name: lania-backup-${{ github.run_id }}
          path: backups/*.gpg
          retention-days: 30
          if-no-files-found: error

  retention:
    # Borra conversaciones vencidas (90 días) y audios de respuestas. Antes era un cron de Render (de pago).
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults: { run: { working-directory: apps/api } }
    env:
      DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
      APP_ENV: staging
      AUTH_MODE: supabase
      SUPABASE_URL: https://ubqbhgfvghewgxoywcqy.supabase.co
    steps:
      - uses: actions/checkout@v4
      - name: ¿Está configurado?
        id: cfg
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::notice::Falta el secret SUPABASE_DB_URL: no se limpia todavía."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: astral-sh/setup-uv@v6
        if: steps.cfg.outputs.ready == 'true'
      - if: steps.cfg.outputs.ready == 'true'
        run: uv sync --no-dev && uv run --no-dev python -m app.jobs.retention

  health:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: El servidor y la base responden
        env:
          URL: ${{ vars.API_HEALTH_URL }}
        run: |
          if [ -z "$URL" ]; then echo "::notice::Falta la variable API_HEALTH_URL"; exit 0; fi
          curl -fsS --retry 3 --retry-delay 20 --max-time 30 "$URL"
