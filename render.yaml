# Blueprint de Render para la API del piloto (la web va en Vercel). Guía: docs/operations/deploy-piloto.md
services:
  - type: web
    name: lania-api
    runtime: docker
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    plan: starter
    region: oregon
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: staging
      - key: AUTH_MODE
        value: supabase
      - key: SUPABASE_URL
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: LLM_PROVIDER
        value: openai_compatible
      - key: LLM_BASE_URL
        value: https://api.openai.com/v1
      - key: LLM_API_KEY
        sync: false
      - key: LLM_FAST_MODEL
        sync: false
      - key: LLM_DEEP_MODEL
        sync: false
      - key: LLM_FAST_REASONING_EFFORT
        sync: false
      - key: LLM_DEEP_REASONING_EFFORT
        sync: false
      - key: LLM_FAST_PRICE_IN_PER_MTOK
        sync: false
      - key: LLM_FAST_PRICE_OUT_PER_MTOK
        sync: false
      - key: LLM_DEEP_PRICE_IN_PER_MTOK
        sync: false
      - key: LLM_DEEP_PRICE_OUT_PER_MTOK
        sync: false
      - key: MONTHLY_AI_SPEND_LIMIT_USD
        sync: false

  # Retención: borra conversaciones vencidas (90 días) una vez al día.
  - type: cron
    name: lania-retention
    runtime: docker
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    plan: starter
    region: oregon
    schedule: "0 8 * * *"
    dockerCommand: python -m app.jobs.retention
    envVars:
      - key: APP_ENV
        value: staging
      - key: AUTH_MODE
        value: supabase
      - key: SUPABASE_URL
        sync: false
      - key: DATABASE_URL
        sync: false
