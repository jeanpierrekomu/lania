# Blueprint de Render para la API del piloto (la web va en Vercel). Guía: docs/operations/deploy-piloto.md
# Solo 2 secretos se pegan en el panel de Render: DATABASE_URL y LLM_API_KEY. Lo demás es público y va aquí.
services:
  - type: web
    name: lania-api
    runtime: docker
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    plan: starter
    region: oregon
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: staging
      - key: AUTH_MODE
        value: supabase
      - key: SUPABASE_URL
        value: https://ubqbhgfvghewgxoywcqy.supabase.co
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        value: '["https://lania-iota.vercel.app"]'
      - key: LLM_PROVIDER
        value: openai_compatible
      - key: LLM_BASE_URL
        value: https://api.openai.com/v1
      - key: LLM_API_KEY
        sync: false
      - key: LLM_FAST_MODEL
        value: gpt-6-luna
      - key: LLM_DEEP_MODEL
        value: gpt-6-luna
      - key: LLM_FAST_REASONING_EFFORT
        value: low
      - key: LLM_DEEP_REASONING_EFFORT
        value: high
      - key: LLM_FAST_PRICE_IN_PER_MTOK
        value: "0.10"
      - key: LLM_FAST_PRICE_OUT_PER_MTOK
        value: "0.50"
      - key: LLM_DEEP_PRICE_IN_PER_MTOK
        value: "0.10"
      - key: LLM_DEEP_PRICE_OUT_PER_MTOK
        value: "0.50"
      - key: MONTHLY_AI_SPEND_LIMIT_USD
        value: "5"
      - key: LLM_TIMEOUT_SECONDS
        value: "90"
      - key: STT_MODEL
        value: gpt-transcribe
      - key: STT_PRICE_PER_MINUTE_USD
        value: "0.0045"
      - key: TTS_MODEL
        value: gpt-4o-mini-tts
      - key: TTS_VOICE_LANIA
        value: marin

  # Retención: borra conversaciones vencidas (90 días) una vez al día.
  - type: cron
    name: lania-retention
    runtime: docker
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    plan: starter
    region: oregon
    schedule: "0 8 * * *"
    dockerCommand: python -m app.jobs.retention
    envVars:
      - key: APP_ENV
        value: staging
      - key: AUTH_MODE
        value: supabase
      - key: SUPABASE_URL
        value: https://ubqbhgfvghewgxoywcqy.supabase.co
      - key: DATABASE_URL
        sync: false
