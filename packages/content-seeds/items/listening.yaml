# Preguntas de comprensión del Listening Lab (episodios en listening/*.yaml).
# Contenido ORIGINAL para el piloto. review_status: pilot = PENDIENTE de revisión por docente de inglés.
#
# Reglas:
#   pool: listening → solo se usan dentro de su episodio (nunca en lecciones, repasos ni diagnóstico).
#   La respuesta se comprueba en el servidor (la clave no llega al navegador) y cuenta como evidencia.
#   El feedback de cada opción incorrecta orienta a escuchar de nuevo SIN revelar la respuesta.

defaults: &defaults
  version: 1
  pool: listening
  type: choice
  rubric_version: grammar_closed_v1
  license: original
  review_status: pilot

items:
  # ───────────── cafe-order (A1) ─────────────
  - <<: *defaults
    id: listening.cafe_order.01
    skill: listening.specific_information
    cefr_estimate: A1
    difficulty: 1
    prompt:
      instruction_es: "Escucha el episodio y elige la respuesta."
      question_en: "What does Ana order to drink?"
      options:
        - { id: a, text: "A large coffee" }
        - { id: b, text: "A small coffee with milk" }
        - { id: c, text: "A tea with milk" }
    answer:
      correct_option: b
      explanation_es: "Ana dice «Can I have a small coffee with milk, please?»: small = pequeño, with milk = con leche."
      option_feedback:
        a:
          rule: listening.detail
          feedback_es: "Casi: es café, pero escucha bien el tamaño que pide."
        c:
          rule: listening.detail
          feedback_es: "Sí lleva leche, pero vuelve a escuchar qué bebida pide."
  - <<: *defaults
    id: listening.cafe_order.02
    skill: listening.main_idea
    cefr_estimate: A1
    difficulty: 1
    prompt:
      instruction_es: "Escucha el episodio y elige la respuesta."
      question_en: "Why does Ana want her coffee to go?"
      options:
        - { id: a, text: "She is late for work." }
        - { id: b, text: "The café is full." }
        - { id: c, text: "She wants to drink it at home." }
    answer:
      correct_option: a
      explanation_es: "Ana explica «I'm late for work»: va tarde al trabajo, por eso lo pide para llevar (to go)."
      option_feedback:
        b:
          rule: listening.main_idea
          feedback_es: "Nadie habla de que el café esté lleno. Escucha qué dice Ana justo después de «To go, please»."
        c:
          rule: listening.main_idea
          feedback_es: "Ana no menciona su casa. Escucha la razón que da después de «To go, please»."
  - <<: *defaults
    id: listening.cafe_order.03
    skill: listening.specific_information
    cefr_estimate: A1
    difficulty: 2
    prompt:
      instruction_es: "Escucha el episodio y elige la respuesta."
      question_en: "How much does Ana pay in total?"
      options:
        - { id: a, text: "$5.60" }
        - { id: b, text: "$6.15" }
        - { id: c, text: "$6.50" }
    answer:
      correct_option: c
      explanation_es: "El barista dice «six fifty»: en inglés los precios se dicen así, 6.50."
      option_feedback:
        a:
          rule: listening.numbers
          feedback_es: "Los números están cerca, pero el orden no. Escucha de nuevo: el primer número es el de los dólares."
        b:
          rule: listening.numbers
          feedback_es: "Ojo: fifteen (15) y fifty (50) suenan parecido. Fíjate en el final de la palabra."

  # ───────────── interview-call (A2) ─────────────
  - <<: *defaults
    id: listening.interview_call.01
    skill: listening.main_idea
    cefr_estimate: A2
    difficulty: 2
    prompt:
      instruction_es: "Escucha el episodio y elige la respuesta."
      question_en: "Why is Laura calling Diego?"
      options:
        - { id: a, text: "To offer him the job" }
        - { id: b, text: "To invite him to an interview" }
        - { id: c, text: "To ask for his email address" }
    answer:
      correct_option: b
      explanation_es: "Laura dice «we'd like to invite you to an interview»: lo invitan a una entrevista, todavía no le ofrecen el trabajo."
      option_feedback:
        a:
          rule: listening.main_idea
          feedback_es: "Todavía no: es el paso anterior al trabajo. Escucha qué le ofrece Laura exactamente."
        c:
          rule: listening.main_idea
          feedback_es: "Al final habla de un email, pero no es el motivo de la llamada. Escucha el tercer fragmento."
  - <<: *defaults
    id: listening.interview_call.02
    skill: listening.specific_information
    cefr_estimate: A2
    difficulty: 2
    prompt:
      instruction_es: "Escucha el episodio y elige la respuesta."
      question_en: "When is the interview?"
      options:
        - { id: a, text: "Thursday at 10 a.m." }
        - { id: b, text: "Friday at 10 a.m." }
        - { id: c, text: "Friday at 3 p.m." }
    answer:
      correct_option: c
      explanation_es: "Diego no puede el jueves; Laura propone «Friday at three in the afternoon» y él acepta."
      option_feedback:
        a:
          rule: listening.detail
          feedback_es: "Ese fue el primer horario, pero Diego no puede. Escucha qué proponen después."
        b:
          rule: listening.detail
          feedback_es: "El día es correcto. Escucha de nuevo la hora: in the afternoon = por la tarde."
  - <<: *defaults
    id: listening.interview_call.03
    skill: listening.specific_information
    cefr_estimate: A2
    difficulty: 3
    prompt:
      instruction_es: "Escucha el episodio y elige la respuesta."
      question_en: "What does Diego need for the interview?"
      options:
        - { id: a, text: "A computer and a good internet connection" }
        - { id: b, text: "A printed CV" }
        - { id: c, text: "A car to go to the office" }
    answer:
      correct_option: a
      explanation_es: "Es online: «you only need a computer and a good connection»."
      option_feedback:
        b:
          rule: listening.detail
          feedback_es: "No se menciona ningún documento. Escucha qué tipo de entrevista es."
        c:
          rule: listening.detail
          feedback_es: "No tiene que ir a ninguna oficina. Escucha qué tipo de entrevista es."

  # ───────────── airport-gate (A2) ─────────────
  - <<: *defaults
    id: listening.airport_gate.01
    skill: listening.specific_information
    cefr_estimate: A2
    difficulty: 2
    prompt:
      instruction_es: "Escucha el episodio y elige la respuesta."
      question_en: "What is the new gate for the flight to Cancún?"
      options:
        - { id: a, text: "Gate 4" }
        - { id: b, text: "Gate 12" }
        - { id: c, text: "Gate 10" }
    answer:
      correct_option: b
      explanation_es: "El anuncio dice «gate twelve, not gate four»: la puerta nueva es la 12."
      option_feedback:
        a:
          rule: listening.detail
          feedback_es: "Esa era la puerta anterior. Escucha la palabra «not» en el anuncio."
        c:
          rule: listening.detail
          feedback_es: "La 10 aparece, pero para otra cosa. Escucha el primer anuncio."
  - <<: *defaults
    id: listening.airport_gate.02
    skill: listening.specific_information
    cefr_estimate: A2
    difficulty: 3
    prompt:
      instruction_es: "Escucha el episodio y elige la respuesta."
      question_en: "What time does boarding start?"
      options:
        - { id: a, text: "4:45" }
        - { id: b, text: "4:15" }
        - { id: c, text: "5:45" }
    answer:
      correct_option: a
      explanation_es: "«Boarding starts at four forty-five»: 4:45."
      option_feedback:
        b:
          rule: listening.numbers
          feedback_es: "Forty y fifteen son distintos. Escucha de nuevo el final de la hora."
        c:
          rule: listening.numbers
          feedback_es: "Los minutos están bien; revisa la hora (el primer número)."
  - <<: *defaults
    id: listening.airport_gate.03
    skill: listening.main_idea
    cefr_estimate: A2
    difficulty: 2
    prompt:
      instruction_es: "Escucha el episodio y elige la respuesta."
      question_en: "Can Sofía buy water before boarding?"
      options:
        - { id: a, text: "No, there is no time." }
        - { id: b, text: "Yes, she has about twenty minutes." }
        - { id: c, text: "Only after the flight." }
    answer:
      correct_option: b
      explanation_es: "El empleado dice «you have about twenty minutes» y le indica una tienda junto a la puerta 10."
      option_feedback:
        a:
          rule: listening.main_idea
          feedback_es: "Escucha la respuesta del empleado: empieza con «Yes»."
        c:
          rule: listening.main_idea
          feedback_es: "Escucha de nuevo: el empleado le dice cuánto tiempo tiene ahora."

  # ───────────── team-meeting (B1) ─────────────
  - <<: *defaults
    id: listening.team_meeting.01
    skill: listening.specific_information
    cefr_estimate: B1
    difficulty: 3
    prompt:
      instruction_es: "Escucha el episodio y elige la respuesta."
      question_en: "When is the client presentation now?"
      options:
        - { id: a, text: "Wednesday" }
        - { id: b, text: "Thursday morning" }
        - { id: c, text: "Friday" }
    answer:
      correct_option: b
      explanation_es: "Tom dice «they moved it to Thursday morning»: la cambiaron al jueves por la mañana."
      option_feedback:
        a:
          rule: listening.detail
          feedback_es: "Era el día original, pero cambió. Escucha la palabra «moved»."
        c:
          rule: listening.detail
          feedback_es: "El viernes es cuando enviaron el email, no la fecha de la presentación."
  - <<: *defaults
    id: listening.team_meeting.02
    skill: listening.main_idea
    cefr_estimate: B1
    difficulty: 3
    prompt:
      instruction_es: "Escucha el episodio y elige la respuesta."
      question_en: "What will Carla send to Tom?"
      options:
        - { id: a, text: "The slides" }
        - { id: b, text: "The client's email" }
        - { id: c, text: "The sales numbers" }
    answer:
      correct_option: c
      explanation_es: "Tom necesita «the sales numbers» y Carla responde «I'll send them to you this afternoon»."
      option_feedback:
        a:
          rule: listening.main_idea
          feedback_es: "Las diapositivas las prepara Tom. Escucha qué le pide él a Carla."
        b:
          rule: listening.main_idea
          feedback_es: "Del email solo se habla al principio. Escucha qué necesita Tom para terminar."
  - <<: *defaults
    id: listening.team_meeting.03
    skill: listening.specific_information
    cefr_estimate: B1
    difficulty: 3
    prompt:
      instruction_es: "Escucha el episodio y elige la respuesta."
      question_en: "Where and when will they practice the presentation?"
      options:
        - { id: a, text: "On Wednesday at 2, in the small meeting room" }
        - { id: b, text: "On Tuesday after lunch, in Carla's office" }
        - { id: c, text: "On Thursday morning, online" }
    answer:
      correct_option: a
      explanation_es: "Tom propone el miércoles y Carla dice «Let's meet at two, after lunch, in the small meeting room»."
      option_feedback:
        b:
          rule: listening.detail
          feedback_es: "El martes es para terminar las diapositivas. Escucha la última propuesta."
        c:
          rule: listening.detail
          feedback_es: "El jueves es la presentación con el cliente. Escucha cuándo practican antes."

  # ───────────── weekend-plans (A2) ─────────────
  - <<: *defaults
    id: listening.weekend_plans.01
    skill: listening.specific_information
    cefr_estimate: A2
    difficulty: 2
    prompt:
      instruction_es: "Escucha el episodio y elige la respuesta."
      question_en: "Where and when is the concert?"
      options:
        - { id: a, text: "In the park at six" }
        - { id: b, text: "At Valeria's place at six" }
        - { id: c, text: "In the park at seven" }
    answer:
      correct_option: a
      explanation_es: "Valeria dice «There's a free concert in the park at six»."
      option_feedback:
        b:
          rule: listening.detail
          feedback_es: "En casa de Valeria es el plan B. Escucha dónde es el concierto."
        c:
          rule: listening.numbers
          feedback_es: "El lugar está bien. Escucha la hora otra vez."
  - <<: *defaults
    id: listening.weekend_plans.02
    skill: listening.main_idea
    cefr_estimate: A2
    difficulty: 2
    prompt:
      instruction_es: "Escucha el episodio y elige la respuesta."
      question_en: "What is the plan if it rains?"
      options:
        - { id: a, text: "Stay at home alone" }
        - { id: b, text: "Watch a movie at Valeria's place" }
        - { id: c, text: "Go to the concert anyway" }
    answer:
      correct_option: b
      explanation_es: "«If it rains, we can watch a movie at my place instead»: si llueve, ven una película en casa de Valeria."
      option_feedback:
        a:
          rule: listening.main_idea
          feedback_es: "No van a estar solas. Escucha la frase que empieza con «If it rains»."
        c:
          rule: listening.main_idea
          feedback_es: "Escucha la palabra «instead» (en lugar de eso)."
  - <<: *defaults
    id: listening.weekend_plans.03
    skill: listening.specific_information
    cefr_estimate: A2
    difficulty: 2
    prompt:
      instruction_es: "Escucha el episodio y elige la respuesta."
      question_en: "What will Kim bring?"
      options:
        - { id: a, text: "Popcorn" }
        - { id: b, text: "Her brother and some drinks" }
        - { id: c, text: "Some snacks" }
    answer:
      correct_option: c
      explanation_es: "Kim dice «I'll bring some snacks». Las palomitas (popcorn) ya las tiene Valeria."
      option_feedback:
        a:
          rule: listening.detail
          feedback_es: "Las palomitas son de Valeria. Escucha qué dice Kim con «I'll bring»."
        b:
          rule: listening.detail
          feedback_es: "Kim solo pregunta si puede invitar a su hermano. Escucha qué dice que llevará."
