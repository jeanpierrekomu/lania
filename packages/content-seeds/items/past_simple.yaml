  - <<: *defaults
    id: grammar.past_simple.did.012
    type: fill_blank
    cefr_estimate: A2
    difficulty: 2
    prompt:
      instruction_es: "Completa la pregunta con el auxiliar correcto. Es una pregunta sobre el pasado."
      sentence_en: "What ___ you do last weekend?"
      hint_es: "Mira last weekend. El verbo do después de you es el verbo principal («hacer»)."
    answer:
      subject: 2s
      polarity: question
      tense: past_simple
      accepted: ["did"]
      explanation_es: "Pregunta en pasado con palabra interrogativa: What + did + sujeto + verbo base. Aquí do es el verbo principal («hacer»): What did you do…?"
      distractors:
        - answers: ["do"]
          rule: grammar.past_simple.did_for_past
          feedback_es: "«What do you do?» pregunta por tu trabajo o tu rutina (presente). Con last weekend necesitamos pasado: What did you do?"
          minimal_correction: "did"
          retry_hint_es: "Fíjate en last weekend. ¿Cuál es el pasado del auxiliar do?"
        - answers: ["does"]
          rule: grammar.past_simple.did_for_past
          feedback_es: "Does es presente y para he / she / it. Con last weekend y you: did."
          minimal_correction: "did"
          retry_hint_es: "Last weekend indica pasado. El auxiliar del pasado es igual para todos."
        - answers: ["were", "was", "are"]
          rule: grammar.past_simple.no_be_with_main_verb
          feedback_es: "Were / are no forman preguntas con un verbo normal como do. Usamos did: What did you do?"
          minimal_correction: "did"
          retry_hint_es: "El verbo principal es do («hacer»). ¿Qué auxiliar del pasado lo acompaña?"
        - answers: ["have"]
          rule: grammar.past_simple.finished_time_marker
          feedback_es: "Have no va con do en forma base ni con last weekend, que ya terminó. Usamos did."
          minimal_correction: "did"
          retry_hint_es: "Last weekend es un tiempo terminado. ¿Qué auxiliar usa el pasado simple?"

  - <<: *defaults
    id: grammar.past_simple.did.013
    type: choice
    cefr_estimate: A2
    difficulty: 2
    prompt:
      instruction_es: "Elige la pregunta correcta sobre un viaje que ya pasó."
      question_en: "Which question is correct?"
      options:
        - { id: a, text: "Did you went to Machu Picchu on your trip?" }
        - { id: b, text: "Did you go to Machu Picchu on your trip?" }
        - { id: c, text: "Went you to Machu Picchu on your trip?" }
        - { id: d, text: "Were you go to Machu Picchu on your trip?" }
      hint_es: "En una pregunta en pasado, el pasado se marca una sola vez."
    answer:
      correct_option: b
      explanation_es: "Pregunta en pasado: Did + sujeto + verbo base. Did ya lleva el pasado: Did you go…?"
      option_feedback:
        a:
          rule: grammar.past_simple.did_base_form
          feedback_es: "Casi. Did ya marca el pasado, así que el verbo vuelve a la base: go, no went."
          retry_hint_es: "Mira el verbo que va después de Did: ¿necesita estar en pasado?"
        c:
          rule: grammar.question.word_order
          feedback_es: "En español podemos empezar con el verbo («¿Fuiste tú…?»), pero en inglés la pregunta con un verbo normal necesita auxiliar: Did you go…?"
          retry_hint_es: "Las preguntas con verbos normales empiezan con un auxiliar."
        d:
          rule: grammar.past_simple.no_be_with_main_verb
          feedback_es: "Were no forma preguntas con un verbo normal como go. Usamos Did: Did you go…?"
          retry_hint_es: "Was/were no acompañan a un verbo normal. ¿Qué auxiliar sí?"

  - <<: *defaults
    id: grammar.past_simple.did.014
    type: choice
    cefr_estimate: A2
    difficulty: 2
    prompt:
      instruction_es: "Ana sí aprobó el examen. Elige la respuesta corta correcta."
      question_en: "“Did Ana pass the exam?” — “Yes, she ___.”"
      options:
        - { id: a, text: "did" }
        - { id: b, text: "does" }
        - { id: c, text: "was" }
        - { id: d, text: "didn't" }
      hint_es: "La respuesta corta repite el auxiliar de la pregunta."
    answer:
      correct_option: a
      explanation_es: "La pregunta usa Did, así que la respuesta corta afirmativa es Yes, she did."
      option_feedback:
        b:
          rule: grammar.past_simple.short_answer_auxiliary
          feedback_es: "Does es del presente. La pregunta usa Did: Yes, she did."
          retry_hint_es: "Mira con qué auxiliar empieza la pregunta."
        c:
          rule: grammar.past_simple.short_answer_auxiliary
          feedback_es: "Was respondería a una pregunta con Was she…?. Esta pregunta usa Did: Yes, she did."
          retry_hint_es: "La respuesta corta usa el mismo auxiliar que la pregunta."
        d:
          rule: grammar.short_answer.polarity
          feedback_es: "Didn't es negativo y no combina con Yes. Ana sí aprobó: Yes, she did."
          retry_hint_es: "Yes va con la forma afirmativa del auxiliar."

  - <<: *defaults
    id: grammar.past_simple.did.015
    type: fill_blank
    cefr_estimate: A2
    difficulty: 2
    prompt:
      instruction_es: "Completa en negativo, en pasado simple, con did + not."
      sentence_en: "The client ___ to our email yesterday, so I called her this morning."
      verb_hint: "not / reply"
