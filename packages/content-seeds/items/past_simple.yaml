      explanation_es: "Negativa en pasado: didn't (did not) + verbo base, para cualquier sujeto: the client didn't reply."
      alternatives:
        - answers: ["couldn't reply"]
          verdict: partial
          rule: task.form_mismatch.modal
          feedback_es: "«The client couldn't reply» es inglés correcto («no pudo responder»), pero la consigna pedía did + not: didn't reply."
          retry_hint_es: "La consigna pide el auxiliar del pasado simple, no could."
      distractors:
        - answers: ["didn't replied", "didn't replies"]
          rule: grammar.past_simple.did_base_form
          feedback_es: "Muy bien el didn't. Después de didn't el verbo va en base: reply (sin -ied ni -ies)."
          minimal_correction: "didn't reply"
          retry_hint_es: "Después de didn't, el verbo va tal como aparece en el diccionario."
        - answers: ["not replied", "no replied", "not reply", "no reply"]
          rule: grammar.past_simple.negative_needs_did
          feedback_es: "En inglés la negativa necesita un auxiliar antes de not. En pasado: didn't reply."
          minimal_correction: "didn't reply"
          retry_hint_es: "Falta el auxiliar antes de not. ¿Cuál es el del pasado?"
        - answers: ["doesn't reply", "don't reply"]
          rule: grammar.past_simple.did_for_past
          feedback_es: "Esa negativa es del presente. Yesterday pide pasado: didn't reply."
          minimal_correction: "didn't reply"
          retry_hint_es: "Fíjate en yesterday. ¿El auxiliar está en presente o en pasado?"
        - answers: ["wasn't reply", "wasn't replied"]
          rule: grammar.past_simple.no_be_with_main_verb
          feedback_es: "Wasn't no niega un verbo normal como reply. Usamos didn't + verbo base."
          minimal_correction: "didn't reply"
          retry_hint_es: "Con un verbo normal no usamos was para negar. ¿Qué auxiliar usamos?"
        - answers: ["hasn't replied"]
          rule: grammar.past_simple.finished_time_marker
          feedback_es: "El presente perfecto no va con yesterday, que ya terminó. Aquí: didn't reply."
          minimal_correction: "didn't reply"
          retry_hint_es: "Yesterday es un tiempo terminado. ¿Qué tiempo verbal corresponde?"
