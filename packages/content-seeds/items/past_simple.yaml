        - answers: ["writed"]
          rule: grammar.past_simple.irregular_form
          feedback_es: "Bien pensado: el pasado regular lleva -ed. Pero write es irregular: wrote."
          minimal_correction: "wrote"
          retry_hint_es: "Write es irregular: su pasado no termina en -ed."
        - answers: ["written", "have written"]
          rule: grammar.past_simple.irregular_form
          feedback_es: "Written es participio (have written) y no va con yesterday. El pasado simple es wrote."
          minimal_correction: "wrote"
          retry_hint_es: "Busca la forma del pasado simple, no la del participio."
        - answers: ["did wrote"]
          rule: grammar.past_simple.did_base_form
          feedback_es: "Aquí sobra did. En la afirmativa basta con el verbo en pasado: wrote."
          minimal_correction: "wrote"
          retry_hint_es: "En la afirmativa neutra no hace falta auxiliar."
        - answers: ["was write", "was wrote"]
          rule: grammar.past_simple.no_be_with_main_verb
          feedback_es: "Was no acompaña a un verbo normal. Solo el verbo en pasado: wrote."
