  - <<: *defaults
    id: grammar.present_simple.sva.017
    type: choice
    cefr_estimate: A1
    difficulty: 1
    prompt:
      instruction_es: "Alguien te pregunta qué haces. Elige la respuesta correcta."
      question_en: "“What do you do?” — “I ___ graphic design at university.”"
      options:
        - { id: a, text: "am study" }
        - { id: b, text: "study" }
        - { id: c, text: "studies" }
        - { id: d, text: "studying" }
      hint_es: "Con I, el verbo va tal cual, sin nada delante."
    answer:
      correct_option: b
      explanation_es: "Con I usamos el verbo base: I study. Describe tu actividad habitual."
      option_feedback:
        a:
          rule: grammar.present_simple.no_be_with_main_verb
          feedback_es: "«I am study» es un error muy común en hispanohablantes: am no acompaña a un verbo normal. Es I study (o I'm studying si quieres decir «estoy estudiando ahora»)."
          retry_hint_es: "¿Am acompaña a un verbo normal en presente simple?"
        c:
          rule: grammar.present_simple.no_s_non_third
          feedback_es: "Studies es para he / she / it. Con I: study."
          retry_hint_es: "El sujeto es I. ¿El verbo cambia de forma con I?"
        d:
          rule: grammar.present_continuous.missing_be
          feedback_es: "Studying necesitaría am delante (I'm studying). En esta opción falta, así que la correcta es I study."
          retry_hint_es: "Una forma con -ing sola no está completa. ¿Qué opción describe tu actividad habitual?"
