      hint_es: "The app = it."
    answer:
      subject: 3s
      verb: { base: allow, third: allows, ing: allowing }
      accepted: ["allows"]
      explanation_es: "The app = it → allows. Describir lo que hace un producto es un uso típico del presente simple."
      alternatives:
        - answers: ["enables", "permits"]
          verdict: partial
          rule: task.verb_hint_mismatch
          feedback_es: "Tu verbo es correcto y con -s, pero la consigna pide usar allow: allows."
          retry_hint_es: "Tu verbo es válido, pero ¿es el que indica la pista?"

  - <<: *defaults
    id: grammar.present_simple.sva.009
    type: fill_blank
    cefr_estimate: A1
    difficulty: 2
    prompt:
      instruction_es: "Completa con el verbo en presente simple. Es su costumbre."
      sentence_en: "Our designer ___ to the office by bike."
      verb_hint: "go"
      hint_es: "Our designer = he o she. Ojo con la ortografía de go."
    answer:
      subject: 3s
      verb: { base: go, third: goes, ing: going }
      accepted: ["goes"]
      explanation_es: "Tercera persona → -s; los verbos que terminan en -o agregan -es: goes."
      distractors:
        - answers: ["gos"]
          rule: spelling.third_person.o_es
          feedback_es: "Bien la tercera persona. Ortografía: después de -o se agrega -es → goes."
          retry_hint_es: "Revisa la ortografía: ¿qué se agrega a los verbos que terminan en -o?"
          minimal_correction: "goes"

  - <<: *defaults
    id: grammar.present_simple.sva.010
    type: fill_blank
    cefr_estimate: A1
    difficulty: 2
    prompt:
      instruction_es: "Completa en negativo, en presente simple."
      sentence_en: "I ___ on Sundays."
      verb_hint: "not / work"
      hint_es: "Con I, el auxiliar negativo es…"
    answer:
      subject: 1s
      polarity: negative
      verb: { base: work, third: works, ing: working }
      accepted: ["don't work"]
      explanation_es: "Con I la negativa es don't (do not) + verbo base: I don't work."
      alternatives:
        - answers: ["am not working"]
          verdict: partial
          rule: task.tense_mismatch.present_continuous
          feedback_es: "«I'm not working on Sundays» es inglés correcto (presente continuo: algo temporal o un plan), pero la consigna pide presente simple para un hábito: don't work."
          retry_hint_es: "Tu frase es inglés correcto, pero vuelve a leer la consigna: ¿qué tiempo verbal pide?"
        - answers: ["never work"]
          verdict: partial
          rule: task.instruction_mismatch.never_instead_of_not
          feedback_es: "«I never work on Sundays» es presente simple correcto con sentido negativo, pero la consigna pide negar con not: don't work."
          retry_hint_es: "Tu frase es válida, pero la consigna pide negar con not. ¿Qué auxiliar va con I?"
      distractors:
        - answers: ["doesn't work"]
          rule: grammar.do_does.agreement
          feedback_es: "Buena estructura. Doesn't es solo para he / she / it. Con I: don't."
          retry_hint_es: "El sujeto es I. ¿Qué auxiliar negativo va con I?"
          minimal_correction: "don't work"
        - answers: ["am not work"]
          rule: grammar.present_simple.no_be_with_main_verb
          feedback_es: "Este es el clásico «I am work». Con un verbo normal no usamos am: I don't work."
          retry_hint_es: "¿Am acompaña a un verbo normal en presente simple? Piensa en el auxiliar para negar."
          minimal_correction: "don't work"
        - answers: ["not work", "no work"]
          rule: grammar.present_simple.negative_needs_auxiliary
          feedback_es: "La negativa necesita auxiliar: I don't work."
          retry_hint_es: "La negación necesita un auxiliar antes de not. ¿Cuál va con I?"
          minimal_correction: "don't work"

  - <<: *defaults
    id: grammar.present_simple.sva.011
    type: fill_blank
    cefr_estimate: A1
    difficulty: 1
    prompt:
      instruction_es: "Completa la pregunta con Do o Does."
      sentence_en: "___ you speak Portuguese?"
