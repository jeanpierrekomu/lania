      hint_es: "Your co-founder = he o she."
    answer:
      correct_option: a
      explanation_es: "Your co-founder = he/she → does. Después de does, el verbo queda en base: work."
      option_feedback:
        b:
          rule: grammar.do_does.agreement
          feedback_es: "Do es para I / you / we / they. Tu co-founder es una persona → does."
          retry_hint_es: "Your co-founder es una sola persona. ¿Qué auxiliar va con he / she?"
        c:
          rule: grammar.present_simple.no_be_with_main_verb
          feedback_es: "Is no forma la pregunta con un verbo normal (work). Usamos does."
          retry_hint_es: "Work es un verbo normal: ¿is sirve para formar la pregunta?"
        d:
          rule: grammar.present_simple.question_needs_do
          feedback_es: "La pregunta necesita un auxiliar antes del sujeto: Where does your co-founder work?"
          retry_hint_es: "Una pregunta con where necesita una palabra antes del sujeto. ¿Cuál?"

