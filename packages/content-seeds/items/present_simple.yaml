        - answers: ["can"]
          verdict: partial
          rule: task.instruction_mismatch.modal
          feedback_es: "«Can you speak Portuguese?» es correcto (pregunta por la capacidad), pero la consigna pide completar con Do o Does: Do."
          retry_hint_es: "Tu pregunta es válida, pero la consigna pide completar con Do o Does. ¿Cuál va con you?"
      distractors:
        - answers: ["does"]
          rule: grammar.do_does.agreement
          feedback_es: "Does es para he / she / it. Con you: Do."
          retry_hint_es: "El sujeto es you. ¿Qué auxiliar va con you?"
          minimal_correction: "Do"
        - answers: ["are"]
          rule: grammar.present_simple.no_be_with_main_verb
          feedback_es: "Are no forma preguntas con un verbo normal como speak. Usamos Do."
          retry_hint_es: "Speak es un verbo normal: ¿qué auxiliar usamos para preguntar con él?"
          minimal_correction: "Do"

  - <<: *defaults
    id: grammar.present_simple.sva.012
    type: choice
    cefr_estimate: A1
    difficulty: 2
    prompt:
      instruction_es: "Elige la palabra que completa la pregunta."
      question_en: "Where ___ your co-founder work?"
