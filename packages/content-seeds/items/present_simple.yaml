      alternatives:
        - answers: ["work"]
          verdict: valid_alternative
          rule: grammar.collective_noun.plural_agreement_british
          feedback_es: "Válido: en inglés británico es común tratar team como plural (my team work). En inglés americano lo más habitual es works."
        - answers: ["is working", "are working"]
