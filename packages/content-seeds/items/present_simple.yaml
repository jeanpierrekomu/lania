# Banco semilla — presente simple (grammar_closed_v1)
# Contenido ORIGINAL escrito para el piloto. review_status: pilot = usable en piloto privado,
# PENDIENTE de revisión por docente de inglés (spec §12.4). No es material del ICPNA.
#
# Formato (ADR-004):
#   prompt         → público (se envía al cliente)
#   answer         → privado (nunca sale del backend antes de entregar)
#   subject        → 1s 2s 3s 1p 2p 3p (persona/número del sujeto, para diagnósticos)
#   verb           → formas del verbo, para diagnósticos por regla
#   accepted       → claves; se normalizan (mayúsculas, contracciones, puntuación)
#   alternatives   → respuestas legítimas distintas de la clave, con su veredicto
#   distractors    → errores conocidos con explicación y corrección mínima

defaults: &defaults
  version: 1
  skill: grammar.present_simple.subject_verb_agreement
  rubric_version: grammar_closed_v1
  license: original
  review_status: pilot

items:
  # ───────────── Lección: present-simple-basics ─────────────
  - <<: *defaults
    id: grammar.present_simple.sva.001
    type: choice
    cefr_estimate: A1
    difficulty: 1
    prompt:
      instruction_es: "Elige la oración correcta. Sin pistas: queremos ver qué recuerdas."
      question_en: "Which sentence is correct?"
      options:
        - { id: a, text: "She work in marketing." }
        - { id: b, text: "She works in marketing." }
        - { id: c, text: "She is work in marketing." }
        - { id: d, text: "She working in marketing." }
      hint_es: "Con she, el verbo del presente simple cambia un poquito al final."
    answer:
      correct_option: b
      explanation_es: "Con she / he / it el verbo lleva -s: she works. Es un hecho estable (dónde trabaja), por eso presente simple."
      option_feedback:
        a:
          rule: grammar.present_simple.third_person_s
          feedback_es: "Casi: con she el verbo necesita -s → works."
          retry_hint_es: "¿Quién trabaja? Con she, revisa la terminación del verbo."
        c:
          rule: grammar.present_simple.no_be_with_main_verb
          feedback_es: "No combinamos is con un verbo normal en presente simple. Es como decir «ella es trabaja». Va solo el verbo: she works."
          retry_hint_es: "¿Hace falta is delante de un verbo normal en presente simple?"
        d:
          rule: grammar.present_continuous.missing_be
          feedback_es: "Working necesita is delante (she is working) y significaría «está trabajando ahora». Para un hecho estable: she works."
          retry_hint_es: "Una forma con -ing sola no basta. ¿Qué oración describe un hecho estable?"

  - <<: *defaults
    id: grammar.present_simple.sva.002
    type: fill_blank
    cefr_estimate: A1
    difficulty: 1
    prompt:
      instruction_es: "Completa con el verbo en presente simple. Es un hecho estable, no algo que pasa solo ahora."
      sentence_en: "My sister ___ at a design studio."
      verb_hint: "work"
      hint_es: "My sister = she. ¿Qué le pasa al verbo con she?"
    answer:
      subject: 3s
      verb: { base: work, third: works, ing: working }
      accepted: ["works"]
      explanation_es: "My sister equivale a she, así que el verbo lleva -s: works."
      alternatives:
        - answers: ["is working"]
          verdict: partial
          rule: task.tense_mismatch.present_continuous
          feedback_es: "«My sister is working at a design studio» es inglés correcto, pero suena temporal (por ahora). La consigna pedía un hecho estable: works."
          retry_hint_es: "Tu frase es inglés correcto, pero vuelve a leer la consigna: ¿qué tiempo verbal pide?"

  - <<: *defaults
    id: grammar.present_simple.sva.003
    type: fill_blank
    cefr_estimate: A1
    difficulty: 1
    prompt:
      instruction_es: "Completa con el verbo en presente simple. Habla de una rutina."
      sentence_en: "We ___ a team meeting every Monday."
      verb_hint: "have"
      hint_es: "El sujeto es we. ¿Lleva cambio el verbo con we?"
    answer:
      subject: 1p
      verb: { base: have, third: has, ing: having }
      accepted: ["have"]
      explanation_es: "Con we el verbo queda en su forma base: we have. Every Monday indica rutina → presente simple."
      alternatives:
        - answers: ["are having"]
          verdict: partial
          rule: task.tense_mismatch.present_continuous
          feedback_es: "We are having… existe, pero con every Monday (rutina) lo natural es el presente simple: we have."
          retry_hint_es: "Tu frase es inglés correcto, pero vuelve a leer la consigna: ¿qué tiempo verbal pide?"
        - answers: ["have got"]
          verdict: valid_alternative
          rule: grammar.have_got.british_possession
          feedback_es: "Válido: «we've got / we have got» con el sentido de have es muy común, sobre todo en inglés británico y en conversación. La forma neutra de presente simple es we have."
      distractors:
        - answers: ["has"]
          rule: grammar.present_simple.no_s_non_third
          feedback_es: "Has es solo para he / she / it. Con we usamos have."
          retry_hint_es: "El sujeto es we. ¿Ese verbo cambia de forma con we?"
          minimal_correction: "have"

  - <<: *defaults
    id: grammar.present_simple.sva.004
    type: fill_blank
    cefr_estimate: A1
    difficulty: 2
    prompt:
      instruction_es: "Completa con el verbo en presente simple. Es su rutina habitual."
      sentence_en: "Carla ___ English at night after work."
      verb_hint: "study"
      hint_es: "Carla = she. Ojo con los verbos que terminan en consonante + y."
    answer:
      subject: 3s
      verb: { base: study, third: studies, ing: studying }
      accepted: ["studies"]
      explanation_es: "Carla = she → -s. Como study termina en consonante + y, la y cambia a -ies: studies."
      alternatives:
        - answers: ["is studying"]
          verdict: partial
          rule: task.tense_mismatch.present_continuous
          feedback_es: "«Carla is studying English…» es correcto si es algo temporal. La consigna habla de su rutina: studies."
          retry_hint_es: "Tu frase es inglés correcto, pero vuelve a leer la consigna: ¿qué tiempo verbal pide?"
      distractors:
        - answers: ["studys"]
          rule: spelling.third_person.consonant_y_ies
          feedback_es: "Bien la -s de tercera persona. Solo la ortografía: consonante + y → -ies. Se escribe studies."
          retry_hint_es: "Bien la tercera persona. ¿Qué pasa con la y cuando va después de consonante?"
          minimal_correction: "studies"

  - <<: *defaults
    id: grammar.present_simple.sva.005
    type: fill_blank
    cefr_estimate: A1
    difficulty: 2
    prompt:
      instruction_es: "Completa en negativo, en presente simple."
      sentence_en: "He ___ coffee in the afternoon."
      verb_hint: "not / drink"
      hint_es: "En negativo usamos un auxiliar + not + verbo base. ¿Cuál auxiliar va con he?"
    answer:
      subject: 3s
      polarity: negative
      verb: { base: drink, third: drinks, ing: drinking }
      accepted: ["doesn't drink"]
      explanation_es: "Con he, la negativa es doesn't (does not) + verbo base: he doesn't drink. La -s ya está en does, así que drink queda sin -s."
      distractors:
        - answers: ["don't drink"]
          rule: grammar.do_does.agreement
          feedback_es: "Buena estructura (auxiliar + not + verbo). Solo el auxiliar: con he va doesn't, no don't."
          retry_hint_es: "Revisa el auxiliar negativo: ¿cuál va con he?"
          minimal_correction: "doesn't drink"
        - answers: ["doesn't drinks"]
          rule: grammar.do_does.base_form
          feedback_es: "Muy bien el doesn't. Después de doesn't el verbo va en base, sin -s: drink."
          retry_hint_es: "Después del auxiliar negativo, ¿el verbo lleva -s?"
          minimal_correction: "doesn't drink"
        - answers: ["not drink", "not drinks", "no drink", "no drinks"]
          rule: grammar.present_simple.negative_needs_auxiliary
          feedback_es: "En inglés la negativa necesita un auxiliar antes de not. Con he: doesn't drink."
          retry_hint_es: "La negación en inglés necesita un auxiliar antes de not. ¿Cuál va con he?"
          minimal_correction: "doesn't drink"
        - answers: ["isn't drink", "isn't drinks"]
          rule: grammar.present_simple.no_be_with_main_verb
          feedback_es: "Isn't no se combina con un verbo normal. Para negar drink usamos doesn't: he doesn't drink."
          retry_hint_es: "¿Is sirve para negar un verbo normal como drink? Piensa en el auxiliar del presente simple."
          minimal_correction: "doesn't drink"

  - <<: *defaults
    id: grammar.present_simple.sva.006
    type: fill_blank
    cefr_estimate: A1
    difficulty: 2
    prompt:
      instruction_es: "Completa la pregunta con Do o Does."
      sentence_en: "___ your startup have a website?"
      verb_hint: "do / does"
      hint_es: "Your startup = it."
    answer:
      subject: 3s
      polarity: question
      accepted: ["does"]
      explanation_es: "Your startup equivale a it, así que la pregunta usa Does. El verbo principal queda en base: have."
      alternatives:
        - answers: ["has your startup got a website"]
          verdict: partial
          rule: task.instruction_mismatch.have_got_question
          feedback_es: "«Has your startup got a website?» es inglés británico correcto, pero la consigna pide completar con Do o Does: Does your startup have a website?"
          retry_hint_es: "Tu pregunta es válida, pero la consigna pide empezar con Do o Does. ¿Cuál va con it?"
        - answers: ["doesn't"]
          verdict: partial
          rule: task.instruction_mismatch.negative_question
          feedback_es: "«Doesn't your startup have a website?» es una pregunta negativa correcta (suele expresar sorpresa), pero la consigna pide la pregunta neutra con Do o Does: Does."
          retry_hint_es: "Tu pregunta es válida, pero ¿es neutra? La consigna pide Do o Does."
      distractors:
        - answers: ["do"]
          rule: grammar.do_does.agreement
          feedback_es: "Casi: do es para I / you / we / they. Your startup = it → Does."
          retry_hint_es: "Your startup = it. ¿Qué auxiliar va con it?"
          minimal_correction: "Does"
        - answers: ["is"]
          rule: grammar.present_simple.no_be_with_main_verb
          feedback_es: "Is no forma preguntas con un verbo normal como have. Usamos Does: Does your startup have a website?"
          retry_hint_es: "Have es un verbo normal: ¿qué auxiliar usamos para preguntar con él?"
          minimal_correction: "Does"
        - answers: ["has"]
          rule: grammar.present_simple.question_needs_do
          feedback_es: "Para preguntar en presente simple usamos Do/Does al inicio. Aquí: Does your startup have…?"
          retry_hint_es: "Para preguntar en presente simple, ¿qué palabra va al inicio?"
          minimal_correction: "Does"

  # ───────────── Banco para repaso (ítems distintos a la lección) ─────────────
  - <<: *defaults
