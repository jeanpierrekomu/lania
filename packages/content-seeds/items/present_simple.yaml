  - <<: *defaults
    id: grammar.present_simple.sva.016
    type: fill_blank
    cefr_estimate: A2
    difficulty: 3
    prompt:
      instruction_es: "Completa con el verbo en presente simple. Es su forma habitual de trabajar."
      sentence_en: "My team ___ remotely."
