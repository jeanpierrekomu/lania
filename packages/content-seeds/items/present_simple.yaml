          rule: task.tense_mismatch.present_continuous
          feedback_es: "«My parents are living in Arequipa» es correcto si es temporal. Para un hecho estable: live."
          retry_hint_es: "Tu frase es inglés correcto, pero vuelve a leer la consigna: ¿qué tiempo verbal pide?"

  - <<: *defaults
    id: grammar.present_simple.sva.008
    type: fill_blank
    cefr_estimate: A2
    difficulty: 2
    prompt:
      instruction_es: "Completa con el verbo en presente simple. Describe qué hace la app."
      sentence_en: "The app ___ users to share their designs."
