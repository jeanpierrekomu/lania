  - <<: *defaults
    id: grammar.future.will.012
    type: fill_blank
    cefr_estimate: A2
    difficulty: 3
    prompt:
      instruction_es: "Tu amigo está nervioso por el examen. Tranquilízalo con una predicción: completa en negativo con will."
      sentence_en: "Tomorrow's test ___ difficult."
      verb_hint: "not / be"
      hint_es: "La negativa de will tiene una contracción especial. El verbo be va en su forma base."
    answer:
      subject: 3s
      polarity: negative
      tense: future_will
      verb: { base: be, third: is, ing: being }
      accepted: ["won't be"]
      explanation_es: "La negativa de will es won't (will not) + verbo base. La base de is es be: won't be."
      alternatives:
        - answers: ["isn't going to be"]
          verdict: partial
          rule: task.tense_mismatch.going_to
          feedback_es: "«Tomorrow's test isn't going to be difficult» es inglés correcto, pero la consigna pedía will: won't be."
          retry_hint_es: "La consigna pide la negativa de will."
        - answers: ["isn't"]
          verdict: partial
          rule: task.tense_mismatch.present_simple
          feedback_es: "«Tomorrow's test isn't difficult» es inglés correcto (describe el examen), pero la consigna pedía una predicción con will: won't be."
          retry_hint_es: "La consigna pide la negativa de will + el verbo be."
      distractors:
        - answers: ["won't is", "won't being"]
          rule: grammar.future.will_base_form
          feedback_es: "Muy bien el won't. Después de won't el verbo va en base, y la base de is es be: won't be."
          minimal_correction: "won't be"
          retry_hint_es: "¿Cuál es la forma base de is / am / are?"
        - answers: ["won't to be"]
          rule: grammar.future.will_no_to
          feedback_es: "Después de won't no va to: won't be."
          minimal_correction: "won't be"
          retry_hint_es: "Entre won't y el verbo no va ninguna palabra."
        - answers: ["no will be", "not will be", "will be not"]
          rule: grammar.future.negative_word_order
          feedback_es: "Not va justo después de will: will not be → won't be."
          minimal_correction: "won't be"
          retry_hint_es: "Revisa el orden: not va pegado a will."
        - answers: ["won't"]
          rule: grammar.future.will_needs_verb
          feedback_es: "Falta el verbo después de won't: won't be difficult."
          minimal_correction: "won't be"
          retry_hint_es: "Después de won't necesitas un verbo antes de difficult."

