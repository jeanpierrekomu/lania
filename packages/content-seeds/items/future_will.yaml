      alternatives:
        - answers: ["am going to study"]
          verdict: partial
          rule: task.tense_mismatch.going_to
          feedback_es: "«I'm going to study» es inglés correcto, pero suena a un plan que ya tenías. Para una decisión en el momento, la consigna pedía will: will study."
          retry_hint_es: "Decides en este momento: la consigna pide will."
        - answers: ["am studying"]
          verdict: partial
          rule: task.tense_mismatch.present_continuous
          feedback_es: "«I'm studying for the exam tonight» es inglés correcto para un plan ya organizado, pero la consigna pedía una decisión en el momento con will: will study."
