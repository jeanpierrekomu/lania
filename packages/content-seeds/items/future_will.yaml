          rule: grammar.future.will_base_form
          feedback_es: "Después de will el verbo va en base, sin -ing: Will you call…?"
          retry_hint_es: "Revisa la terminación del verbo."
        d:
          rule: grammar.future.no_do_with_will
          feedback_es: "Will ya es el auxiliar; no se combina con do. La pregunta empieza directamente con Will."
          retry_hint_es: "Un auxiliar es suficiente. ¿Cuál sobra?"

