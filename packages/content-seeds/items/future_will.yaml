          retry_hint_es: "Con I promise, la consigna pide will."
      distractors:
        - answers: ["will learning", "will learns", "will learned"]
          rule: grammar.future.will_base_form
          feedback_es: "Muy bien el will. Después de will el verbo va en base: will learn."
          minimal_correction: "will learn"
          retry_hint_es: "Después de will, el verbo va tal como aparece en el diccionario."
