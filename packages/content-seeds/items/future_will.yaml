          rule: grammar.future.will_no_to
          feedback_es: "Después de will no va to: will learn."
          minimal_correction: "will learn"
          retry_hint_es: "Entre will y el verbo no va ninguna palabra."
        - answers: ["learn"]
          rule: grammar.future.needs_will
          feedback_es: "En español a veces decimos «te prometo que las aprendo», pero en inglés una promesa sobre el futuro necesita will: will learn."
          minimal_correction: "will learn"
          retry_hint_es: "Falta el auxiliar del futuro delante del verbo."
        - answers: ["am learn"]
          rule: grammar.future.no_be_with_will
          feedback_es: "Am no acompaña a un verbo normal en base. Para prometer: will learn."
          minimal_correction: "will learn"
          retry_hint_es: "Sobra am. ¿Qué auxiliar de futuro necesitas?"

  - <<: *defaults
    id: grammar.future.will.010
    type: fill_blank
    cefr_estimate: A2
    difficulty: 2
    prompt:
      instruction_es: "Tu amiga te convence de no salir. Decides en este momento. Completa con will + verbo."
      sentence_en: "OK, you're right. I ___ for the exam tonight."
      verb_hint: "study"
      hint_es: "Decisión en el momento → will. ¿Cómo queda el verbo después de will?"
    answer:
      subject: 1s
      polarity: affirmative
      tense: future_will
      verb: { base: study, third: studies, ing: studying }
      accepted: ["will study"]
