paragraphs:
  - "My name is Lucía and I live in a small apartment in Arequipa. Last month, a new neighbor moved in next door. Her name is Emma and she is from Canada."
  - "Emma is a nurse. She works at the hospital near our street, so she usually walks to work. She leaves home very early, at six in the morning, and she comes back at three in the afternoon."
  - "On weekends, Emma practices Spanish with me, and I practice English with her. We drink coffee and talk for one hour. She says my English is getting better every week!"
