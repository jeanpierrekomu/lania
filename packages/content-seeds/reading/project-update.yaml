paragraphs:
  - "Hi team, here is a quick update on the launch of our new mobile app. The good news is that the design is finished and the first version passed all the internal tests last Thursday."
  - "Unfortunately, the payment feature still has a few bugs, so we have decided to move the launch from December 1 to December 8. This will give the developers one more week to fix the problems without working overtime."
  - "In the meantime, the marketing team will prepare the social media posts, and customer support will update the help pages. Please send me any questions before Friday, and I'll answer them in our weekly meeting on Monday. Thanks for your hard work! — Daniela"
