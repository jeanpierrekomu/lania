paragraphs:
  - "★★★☆☆ I stayed at the Plaza Inn for three nights in October. The location is perfect: the hotel is only five minutes from the main square, and there are many restaurants nearby."
  - "The staff were very kind. When I arrived early, they let me leave my bags at the reception and gave me a free map of the city. Breakfast was simple but fresh, with fruit, bread, and good coffee."
  - "However, my room was on the first floor, above a bar. The music didn't stop until two in the morning, so I couldn't sleep well. If you stay here, ask for a room on a higher floor."
