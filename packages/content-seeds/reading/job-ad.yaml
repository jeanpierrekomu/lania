paragraphs:
  - "GreenLeaf is a small company that sells plant-based food online. We are looking for a Customer Support Assistant to join our friendly team in Lima."
  - "You will answer customer emails and chats, help people with their orders, and send weekly reports to the sales team. The job is full-time, Monday to Friday, and you can work from home two days a week."
  - "Requirements: good communication skills in Spanish and intermediate English (B1). Experience in customer service is a plus, but it is not necessary. We offer training, health insurance, and a free lunch on Fridays."
  - "To apply, send your CV and a short message in English to jobs@greenleaf.example before November 30."
