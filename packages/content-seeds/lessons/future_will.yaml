# Microclase original para el piloto (review_status: pilot, pendiente de revisión docente).
# Bucle académico (spec §3.1): activar recuerdo (warmup sin pistas) → explicación mínima →
# práctica guiada → feedback → repaso espaciado con ítems distintos.
slug: future-will
version: 1
title_es: "Futuro con will: decisiones, promesas y predicciones"
level: A2
skill: grammar.future.will_base_form
review_status: pilot
content:
  goal_es: "Al terminar podrás usar will + verbo base para decidir en el momento, prometer, ofrecer ayuda y predecir, y también negar con won't y preguntar con Will you…?"
  concept_es: "Will es un auxiliar: va siempre con el verbo base, sin -ing, sin to y sin -s (I will call, she will call). Se usa para decisiones que tomas al hablar, promesas, ofrecimientos y predicciones. La negativa es won't (will not) y la pregunta pone will antes del sujeto: Will you come? Para planes ya decididos antes, el inglés suele preferir be going to."
  analogy_es: "Will funciona como can: es una «llave» que se pone delante del verbo y no deja que el verbo cambie. Igual que no decimos «I can swimming» ni «I can to swim», tampoco decimos «I will swimming» ni «I will to swim»."
  examples:
    - en: "The phone is ringing. I'll answer it."
      es: "Está sonando el teléfono. Yo contesto."
    - en: "I promise I won't forget your birthday."
      es: "Te prometo que no me olvidaré de tu cumpleaños."
    - en: "Will you help me with the slides? — Yes, I will."
      es: "¿Me ayudarás con las diapositivas? — Sí."
  spelling_es:
    - "will not → won't (contracción irregular; no existe ✗ willn't)"
    - "I will → I'll, you will → you'll, she will → she'll"
  common_trap_es: "Después de will va el verbo base, nada más: ✗ I will meeting / ✗ I will to call → ✓ I will meet / ✓ I will call. Y will no se combina con can: ✗ I will can → ✓ I will be able to."
