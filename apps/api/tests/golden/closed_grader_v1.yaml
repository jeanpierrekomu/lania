# Golden dataset — corrector determinista `closed_v1` (ADR-004), banco present_simple.yaml.
#
# Cada caso registra lo que decidiría un docente de inglés cuidadoso (verdad lingüística + consigna
# explícita del ítem), NO lo que hace hoy el código. Si el corrector actual discrepa, el caso lleva
# `known_issue` y el test lo marca xfail(strict=True): al arreglarse pasa a XPASS y el test falla,
# señal para quitar `known_issue`.
#
# Campos:
#   id                 slug único
#   item               id completo del ítem
#   answer | option    respuesta cruda del alumno (fill_blank) | id de opción (choice)
#   expected_verdict   correct | valid_alternative | less_natural | spelling_error | partial | incorrect | needs_review
#   expected_rule      (opcional) regla esperada en matched_rule
#   category           key, case_punct, contraction, full_sentence, typo, grammar_error, task_mismatch,
#                      br_us_variation, collective_noun, emphatic, unrecognized, distractor, adversarial
#   rationale_es       justificación breve
#   known_issue        (opcional) por qué el corrector actual falla este caso
#
# Criterios docentes aplicados:
#   - partial = inglés válido que no cumple la consigna (otro tiempo verbal, otro verbo, otra estructura).
#   - Errores de ortografía del sufijo de 3.ª persona (studys, gos, watchs, checkes) son errores de la
#     regla que el ítem enseña → incorrect, igual que los distractores ya registrados.
#   - Mayúsculas, puntuación, espacios, comillas tipográficas y caracteres invisibles no cuentan.

# ─────────────── sva.001 · choice · She works in marketing ───────────────
- id: c001-opt-b-key
  item: grammar.present_simple.sva.001
  option: b
  expected_verdict: correct
  category: key
  rationale_es: "«She works in marketing» es la única oración correcta."
- id: c001-opt-a-missing-s
  item: grammar.present_simple.sva.001
  option: a
  expected_verdict: incorrect
  expected_rule: grammar.present_simple.third_person_s
  category: distractor
  rationale_es: "Falta la -s de tercera persona."
- id: c001-opt-c-is-work
  item: grammar.present_simple.sva.001
  option: c
  expected_verdict: incorrect
  expected_rule: grammar.present_simple.no_be_with_main_verb
  category: distractor
  rationale_es: "«is work» combina be con verbo base: error típico de hispanohablantes."
- id: c001-opt-d-working
  item: grammar.present_simple.sva.001
  option: d
  expected_verdict: incorrect
  expected_rule: grammar.present_continuous.missing_be
  category: distractor
  rationale_es: "«She working» no tiene auxiliar be."

